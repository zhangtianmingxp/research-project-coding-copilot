auto_next: false
auto_execute_prompt: false
prompt_dir: ans_qes
prompt_prefix: prompt
result_prefix: result
default_language: zh-CN
markdown_docs_language: zh-CN
required_project_rules: PROJECT_RULES.md
context_mode: low
max_recent_results_to_read: 3
prefer_context_summary: true
checkpoint_every_rounds: 20
prompt_max_bytes: 12000
prompt_max_numbered_tasks: 5
pilot_first_for_expensive_work: true
cache_external_api_results: true
require_runtime_environment_record: true
never_read_sensitive_files: true
avoid_full_reads:
  logs: true
  generated_outputs: true
  notebooks: true
  manifests: true
  large_markdown: true
require_user_confirmation:
  before_execute: true
